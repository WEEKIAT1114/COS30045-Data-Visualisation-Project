<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore Australian road crash hospitalisations, 2011–2021, with linked D3 charts and source definitions."
    />
    <title>Overview | Road Crash Hospitalisation Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="overview">
    <!-- GenAI assistance is acknowledged in js/app.js and docs/AI-ACKNOWLEDGEMENT.md. -->
    <a class="skip-link" href="#main">Skip to page content</a>
    <div id="app">
      <header class="site-header"></header>
      <section id="filters-shell" aria-label="Dashboard filters">
        <div class="filter-bar">
          <form id="filters" aria-label="Filter all charts"></form>
        </div>
      </section>
      <main id="main" tabindex="-1"></main>
    </div>
    <dialog id="details" aria-labelledby="details-title">
      <div class="details-heading">
        <h2 id="details-title">Chart details</h2>
        <button
          id="details-close"
          class="icon-button"
          aria-label="Close chart details"
        ></button>
      </div>
      <div class="details-tabs" role="group" aria-label="Chart detail view">
        <button data-detail-mode="info" aria-pressed="true">About this chart</button>
        <button data-detail-mode="data" aria-pressed="false">Data table</button>
      </div>
      <p id="details-info"></p>
      <div id="details-data" hidden></div>
      <div id="details-pager" hidden>
        <button id="details-previous" class="text-button">‹ Previous</button>
        <span id="details-position" aria-live="polite"></span>
        <button id="details-next" class="text-button">Next ›</button>
      </div>
    </dialog>
    <div id="tooltip" role="tooltip" hidden></div>
    <noscript>
      This dashboard needs JavaScript. You can
      <a href="data/road_crash_master.csv" download>download the source CSV</a>
      .
    </noscript>
    <script src="vendor/d3.v7.9.0.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
